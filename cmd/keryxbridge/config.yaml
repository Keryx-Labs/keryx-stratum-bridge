# All file paths are relative to this configuration file.
network: mainnet
keryxd_address: 127.0.0.1:22110
stratum_port: 127.0.0.1:5555
prom_port: 127.0.0.1:2114
health_check_port: 127.0.0.1:2115
block_wait_time: 500ms
min_share_diff: 4
extranonce_size: 0
max_connections: 128
print_stats: true
log_to_file: false

# Required: dedicated, non-public escrow key and its offline payout delegation.
# This example intentionally has no usable payout, key or certificate.
payout_address: ""
escrow_key_file: secrets/escrow.key
escrow_cert: ""
worker_auth_file: secrets/worker-tokens.json
service_state_file: state/service-state.json
verifier_binary: ../../bin/keryx-bridge-verifier
# Optional local integrity pin. A hash is not remote software attestation.
verifier_sha256: ""

# Required together when stratum_port listens outside loopback.
tls_cert_file: ""
tls_key_file: ""

# Block-task work is unscheduled on the pinned H15/H16 networks.
# H15 PoM v5 and H16 pad parameters are selected by the official verifier.
block_task_activation_daa: 0
min_holding_krx: 0
mine_when_not_synced: false
