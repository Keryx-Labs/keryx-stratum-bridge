# stratum_listen_port: the port that will be listening for incoming stratum traffic
# Note `:PORT` format is needed if not specifiying a specific ip range 
stratum_port: :5555

# keryxd_address: address/port of the rpc server for keryxd, typically 22110
keryxd_address: localhost:22110

# min_share_diff: only accept shares of the specified difficulty (or higher) from 
# the miner(s).  Higher values will reduce the number of shares submitted, thereby 
# reducing network traffic and server load, while lower values will increase the
# number of shares submitted, thereby reducing the amount of time needed for 
# accurate hashrate measurements
# min_share_diff: 4

# block_wait_time: time to wait since last new block message from kaspad before
# manually requesting a new block
# block_wait_time: 500ms

# extranonce_size: size in bytes of extranonce, from 0 (no extranonce) to 3. 
# With no extranonce (0), all clients will search through the same nonce-space,
# therefore performing duplicate work unless the miner(s) implement client
# side nonce randomizing.  More bytes allow for more clients with unique 
# nonce-spaces (i.e. no overlapping work), but reduces the per client 
# overall nonce-space (though with 1s block times, this shouldn't really
# be a concern). 
# 1 byte = 256 clients, 2 bytes = 65536, 3 bytes = 16777216.
# extranonce_size: 0

# print_stats: if true will print stats to the console, false just workers
# joining/disconnecting, blocks found, and errors will be printed
print_stats: true

# log_to_file: if true logs will be written to a file local to the executable
log_to_file: true

# prom_port: if this is specified prometheus will serve stats on the port provided
# see readme for summary on how to get prom up and running using docker
# you can get the raw metrics (along with default golang metrics) using
# `curl http://localhost:{prom_port}/metrics`
# Note `:PORT` format is needed if not specifiying a specific ip range
prom_port: :2114

# escrow_key_file: path to the Schnorr private key file used to claim inference_reward
# escrows from AiRequest.output[1] after the 1-hour challenge window (36 000 blocks).
# Defaults to "escrow.key" (same file auto-generated by keryx-miner).
# The bridge logs the corresponding pubkey at startup — requesters must use it in their
# AiRequest.output[1] CSV P2PK script.  Leave unset to use default path.
# escrow_key_file: "escrow.key"

# min_holding_krx: balance-reward gate (option A). A worker whose PAYOUT address holds fewer
# than this many KRX is not given work (no holdings = no mining in this pool). This forces pool
# workers to hold KRX too — not just the pool operator — so miners can't escape the holding
# requirement by joining a pool. Self-binding on the payout address (can't borrow someone
# else's balance, since the pool pays rewards there). Fail-closed: a worker is gated until the
# first periodic balance check (~1 min) confirms its holdings. 0 / unset disables the gate.
# Must be set on every pool that wants to enforce holdings (it's a pool-level policy; a
# non-cooperating pool can simply not set it — the consensus balance-reward still applies).
# min_holding_krx: 50000

# ipfs_api_url: IPFS Kubo API used to verify model weights at declare_capabilities and the CIDs
# miners submit. Defaults to http://127.0.0.1:5001. When this API is local and unreachable at
# startup, the bridge auto-starts a kubo daemon (see ipfs_binary).
# ipfs_api_url: http://127.0.0.1:5001

# ipfs_binary: kubo binary the bridge auto-starts when the local IPFS API is down at startup.
# Empty = look for an `ipfs` next to the bridge executable, then in PATH.
# ipfs_binary: ./ipfs

# escrow_cert: H6 escrow delegation cert (128 hex) announced as /esig:, produced by
# `keryx-cli delegate-escrow <bridge_escrow_pubkey> <payout_address>` (the bridge logs its escrow
# pubkey at startup). From H6 the node rejects every block template without a valid /escrow +
# /esig pair. The cert binds the escrow key to ONE payout address, so every worker must mine with
# that exact address (single-address pools only).
# The value below is an EXAMPLE, bound to the throwaway payout address
# keryx:qz6yf2v36z7379y6dgaqfjk2exa7wv5cju2t4shwkt27xh4pyzvngs6l8kz6h — replace it (and mine with
# your own payout address) for real use.
escrow_cert: 76213db980f7686530b84f7fe195261aa13720d0d4c778495db22b32682745d01bd49ba470883e7a88eeb579ce86133ded206791bae8800cc20d6d57c2f7f335


