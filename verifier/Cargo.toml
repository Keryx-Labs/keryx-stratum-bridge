[package]
name = "keryx-bridge-verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
keryx-consensus-core = { git = "https://github.com/Keryx-Labs/keryx-node", rev = "a69a1a08c0e49181eecafd6128695dd0d7c667e3" }
keryx-verifiable-inference = { git = "https://github.com/Keryx-Labs/keryx-node", rev = "a69a1a08c0e49181eecafd6128695dd0d7c667e3" }
keryx-inference = { git = "https://github.com/Keryx-Labs/keryx-node", rev = "a69a1a08c0e49181eecafd6128695dd0d7c667e3" }
keryx-addresses = { git = "https://github.com/Keryx-Labs/keryx-node", rev = "a69a1a08c0e49181eecafd6128695dd0d7c667e3" }
secp256k1 = { version = "0.29", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
blake2b_simd = "1"
blake3 = "1"

[profile.release]
lto = "thin"
